<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#667eea" />

    <!-- Primary SEO Meta Tags -->
    <title>
      My CA File - CA Office Management Software for Chartered Accountants
    </title>
    <!-- Canonical and Meta tags are managed dynamically by react-helmet-async for 100% SEO precision -->
    <meta name="title" content="My CA File - CA Office Management Software" />
    <meta
      name="description"
      content="My CA File is the leading CA office management software in India. Manage clients, documents, employee tasks, and GST/ITR compliance in one secure platform."
    />
    <meta
      name="keywords"
      content="CA office management software, chartered accountant software, CA client management system, CA practice management India, GST ITR tracking software"
    />
    <meta name="robots" content="index, follow" />
    <!-- This will be handled dynamically by react-helmet-async -->

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mycafile.in/" />
    <meta
      property="og:title"
      content="My CA File - CA Office Management Software"
    />
    <meta
      property="og:description"
      content="Streamline your CA practice. Manage clients, staff, and compliance tasks efficiently with My CA File."
    />
    <meta property="og:image" content="https://mycafile.in/og-image.png" />
    <meta property="og:site_name" content="My CA File" />

    <!-- Twitter Card Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mycafile.in" />
    <meta
      property="twitter:title"
      content="My CA File - CA Office Management Software"
    />
    <meta
      property="twitter:description"
      content="The ultimate practice management tool for Indian Chartered Accountants."
    />
    <meta property="twitter:image" content="https://mycafile.in/og-image.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/webp" href="/faviconca.webp" />
    <link rel="shortcut icon" href="/faviconca.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/faviconca.webp" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://api.mycafile.in" crossorigin />
    <link rel="dns-prefetch" href="https://api.mycafile.in" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data for SEO (JSON-LD) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "My CA File",
          "alternateName": "MyCAFile",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://mycafile.in",
          "description": "Premium CA Office Management Software built for Indian Chartered Accountants. Manage ITR, GST, Audits, and document workflows seamlessly.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR",
            "availability": "https://schema.org/InStock"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.9",
            "reviewCount": "120"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "My CA File",
          "url": "https://mycafile.in",
          "logo": "https://mycafile.in/faviconca.webp",
          "description": "Leading provider of practice management solutions for Chartered Accountants in India.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Surat",
            "addressRegion": "Gujarat",
            "addressCountry": "IN"
          },
          "sameAs": [
            "https://www.linkedin.com/company/mycafile",
            "https://twitter.com/mycafile"
          ]
        },
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "My CA File",
          "alternateName": "MyCAFile-Portal",
          "url": "https://mycafile.in",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://mycafile.in/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "ItemList",
          "itemListElement": [
            {
              "@type": "SiteNavigationElement",
              "position": 1,
              "name": "Solutions",
              "url": "https://mycafile.in/#solutions"
            },
            {
              "@type": "SiteNavigationElement",
              "position": 2,
              "name": "Features",
              "url": "https://mycafile.in/#features"
            },
            {
              "@type": "SiteNavigationElement",
              "position": 3,
              "name": "Pricing",
              "url": "https://mycafile.in/#pricing"
            },
            {
              "@type": "SiteNavigationElement",
              "position": 4,
              "name": "Login",
              "url": "https://mycafile.in/login"
            }
          ]
        }
      ]
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root">
      <!-- Premium Splash Screen -->
      <div id="loader-wrapper" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Inter', sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; animation: loader-fade-in 0.8s ease-out;">
          <div style="position: relative;">
            <div style="width: 80px; height: 80px; background: #ffffff; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(102, 126, 234, 0.15); border: 1px solid rgba(102, 126, 234, 0.1); position: relative; z-index: 2;">
              <img src="/faviconca.webp" alt="My CA File Logo" style="width: 54px; height: 54px; object-fit: contain;">
            </div>
            <div style="position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1)); border-radius: 24px; z-index: 1; animation: loader-glow 3s infinite alternate;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="font-size: 36px; font-weight: 900; color: #1e293b; letter-spacing: -1.5px;">mycafile<span style="color: #667eea">.</span></div>
          </div>
        </div>
        <div style="width: 200px; height: 4px; background: #f1f5f9; border-radius: 10px; overflow: hidden; position: relative; margin-top: 40px;">
          <div style="position: absolute; width: 45%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 10px; animation: loader-slide 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;"></div>
        </div>
        <style>
          @keyframes loader-fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          @keyframes loader-glow { from { transform: scale(0.95); opacity: 0.5; } to { transform: scale(1.05); opacity: 0.8; } }
          @keyframes loader-slide { 0% { left: -45%; } 100% { left: 100%; } }
          #root:not(:empty) #loader-wrapper { display: none !important; }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
