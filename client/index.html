<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#667eea" />

    <!-- Primary SEO Meta Tags -->
    <title>CA Office Portal | Chartered Accountant Firm Management System</title>
    <meta name="title" content="CA Office Portal | CA Firm Management Software" />
    <meta name="description" content="A comprehensive practices management system for Chartered Accountant firms. Securely manage client ledger, billing, documents, and professional task tracking." />
    <meta name="keywords" content="CA Portal, Firm Management, Chartered Accountant, Practice Management, Client Ledger, ITR Management, GST Management" />
    <meta name="author" content="CA Office Portal Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mycafile.in" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mycafile.in" />
    <meta property="og:title" content="CA Office Portal | Professional Firm Management" />
    <meta property="og:description" content="Secure, efficient, and user-friendly practice management for CA Firms." />
    <meta property="og:image" content="https://www.mycafile.in/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.mycafile.in" />
    <meta property="twitter:title" content="CA Office Portal | Firm Management" />
    <meta property="twitter:description" content="Streamline your CA practice with our management portal." />
    <meta property="twitter:image" content="https://www.mycafile.in/og-image.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/webp" href="/ca-portal.webp?v=1" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Structured Data for SEO (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CA Office Portal",
      "operatingSystem": "Web",
      "applicationCategory": "BusinessApplication",
      "description": "Comprehensive practice management software for Chartered Accountants in India. Manage clients, ITR, GST, billing, and documents.",
      "url": "https://www.mycafile.in",
      "publisher": {
        "@type": "Organization",
        "name": "CA Office Portal",
        "url": "https://www.mycafile.in"
      },
      "interest": "Chartered Accountants, Accountants, Finance Professionals",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root">
        <!-- Minimal placeholder layout to reduce LCP and layout shift -->
        <div style="display:flex; height:100vh; font-family: sans-serif; background:#f5f7fa;">
            <div style="width:240px; background:#f8f9fa; border-right:1px solid #ddd; display:none; flex-direction:column; padding:20px;">
                <div style="height:20px; width:120px; background:#eee; border-radius:4px; margin-bottom:20px;"></div>
                <div style="height:20px; width:150px; background:#eee; border-radius:4px; margin-bottom:10px;"></div>
                <div style="height:20px; width:130px; background:#eee; border-radius:4px; margin-bottom:10px;"></div>
            </div>
            <div style="flex:1;">
                <div style="height:64px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); width:100%;"></div>
                <div style="padding:24px;">
                    <div style="height:40px; width:200px; background:#eee; border-radius:8px; margin-bottom:16px;"></div>
                    <div style="height:20px; width:300px; background:#eee; border-radius:4px; margin-bottom:24px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
