<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#667eea" />

    <!-- Primary SEO Meta Tags -->
    <title>My CA File - CA Office Management Software for Chartered Accountants</title>
    <link rel="canonical" href="https://mycafile.in/" />
    <meta name="title" content="My CA File - CA Office Management Software" />
    <meta name="description" content="My CA File is the leading CA office management software in India. Manage clients, documents, employee tasks, and GST/ITR compliance in one secure platform." />
    <meta name="keywords" content="CA office management software, chartered accountant software, CA client management system, CA practice management India, GST ITR tracking software" />
    <meta name="robots" content="index, follow" />
    <!-- This will be handled dynamically by react-helmet-async -->

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mycafile.in/" />
    <meta property="og:title" content="My CA File - CA Office Management Software" />
    <meta property="og:description" content="Streamline your CA practice. Manage clients, staff, and compliance tasks efficiently with My CA File." />
    <meta property="og:image" content="https://mycafile.in/og-image.png" />
    <meta property="og:site_name" content="My CA File" />

    <!-- Twitter Card Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mycafile.in" />
    <meta property="twitter:title" content="My CA File - CA Office Management Software" />
    <meta property="twitter:description" content="The ultimate practice management tool for Indian Chartered Accountants." />
    <meta property="twitter:image" content="https://mycafile.in/og-image.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://api.mycafile.in" crossorigin />
    <link rel="dns-prefetch" href="https://api.mycafile.in" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    
    <!-- Structured Data for SEO (JSON-LD) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "My CA File",
        "alternateName": "MyCAFile",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://mycafile.in",
        "description": "Premium CA Office Management Software built for Indian Chartered Accountants. Manage ITR, GST, Audits, and document workflows seamlessly.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "120"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "My CA File",
        "url": "https://mycafile.in",
        "logo": "https://mycafile.in/favicon.png",
        "description": "Leading provider of practice management solutions for Chartered Accountants in India.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Surat",
          "addressRegion": "Gujarat",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.linkedin.com/company/mycafile",
          "https://twitter.com/mycafile"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "My CA File",
        "alternateName": "MyCAFile-Portal",
        "url": "https://mycafile.in",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://mycafile.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "Solutions",
            "url": "https://mycafile.in/#solutions"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,

            "url": "https://mycafile.in/#features"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "Pricing",
            "url": "https://mycafile.in/#pricing"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 4,
            "name": "Login",
            "url": "https://mycafile.in/login"
          }
        ]
      }
    ]
    </script>

    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root">
        <!-- Minimal placeholder layout to reduce LCP and layout shift -->
        <div style="display:flex; height:100vh; font-family: sans-serif; background:#f5f7fa;">
            <div style="width:240px; background:#f8f9fa; border-right:1px solid #ddd; display:none; flex-direction:column; padding:20px;">
                <div style="height:20px; width:120px; background:#eee; border-radius:4px; margin-bottom:20px;"></div>

                <div style="height:20px; width:130px; background:#eee; border-radius:4px; margin-bottom:10px;"></div>
            </div>
            <div style="flex:1;">
                <div style="height:64px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); width:100%;"></div>
                <div style="padding:24px;">
                    <div style="height:40px; width:200px; background:#eee; border-radius:8px; margin-bottom:16px;"></div>
                    <div style="height:20px; width:300px; background:#eee; border-radius:4px; margin-bottom:24px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
