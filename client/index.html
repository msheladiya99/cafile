<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#667eea" />

    <!-- Primary SEO Meta Tags -->
    <title>My CA File - CA Office Management Software for Chartered Accountants</title>
    <meta name="title" content="My CA File - CA Office Management Software" />
    <meta name="description" content="My CA File is a powerful CA office management software to manage clients, staff, documents, and compliance for chartered accountants." />
    <meta name="keywords" content="CA office management software, chartered accountant software, CA client management system, CA practice management India" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mycafile.in" />
    <meta property="og:title" content="My CA File - CA Office Management Software" />
    <meta property="og:description" content="Manage CA clients, documents, staff and compliance in one platform." />
    <meta property="og:image" content="https://www.mycafile.in/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.mycafile.in" />
    <meta property="twitter:title" content="My CA File - CA Office Management Software" />
    <meta property="twitter:description" content="Manage CA clients, documents, staff and compliance in one platform." />
    <meta property="twitter:image" content="https://www.mycafile.in/og-image.png" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Structured Data for SEO (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "My CA File",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://www.mycafile.in",
      "description": "CA Office Management Software for Chartered Accountants"
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root">
        <!-- Minimal placeholder layout to reduce LCP and layout shift -->
        <div style="display:flex; height:100vh; font-family: sans-serif; background:#f5f7fa;">
            <div style="width:240px; background:#f8f9fa; border-right:1px solid #ddd; display:none; flex-direction:column; padding:20px;">
                <div style="height:20px; width:120px; background:#eee; border-radius:4px; margin-bottom:20px;"></div>
                <div style="height:20px; width:150px; background:#eee; border-radius:4px; margin-bottom:10px;"></div>
                <div style="height:20px; width:130px; background:#eee; border-radius:4px; margin-bottom:10px;"></div>
            </div>
            <div style="flex:1;">
                <div style="height:64px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); width:100%;"></div>
                <div style="padding:24px;">
                    <div style="height:40px; width:200px; background:#eee; border-radius:8px; margin-bottom:16px;"></div>
                    <div style="height:20px; width:300px; background:#eee; border-radius:4px; margin-bottom:24px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
